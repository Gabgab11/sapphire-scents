<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perfumes | Sapphire Scents</title>
<meta name="description" content="Shop all 27 Sapphire Scents perfumes: oud, rose, amber, vanilla and more, made in Nigeria.">
<meta name="theme-color" content="#070C29">
<meta property="og:site_name" content="Sapphire Scents">
<meta property="og:title" content="Perfumes | Sapphire Scents">
<meta property="og:description" content="Shop all 27 Sapphire Scents perfumes: oud, rose, amber, vanilla and more, made in Nigeria.">
<meta property="og:image" content="/images/crown-jagaban.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070C29'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='36' fill='%23FF9E0D'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
<header id="site-header" class="site"></header>
<main id="top">
<section class="pagehead"><div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Perfumes</span></nav><h1>All <em>perfumes</em></h1><p>Twenty-seven fragrances, most of them built on oud and blended with African resins and French oils. Filter by mood or by the note you love.</p></div></section>
<section class="band" style="padding-top:20px"><div class="wrap">
  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by collection"></div>
    <div class="selects">
      <input class="field-inline" id="pq" type="search" placeholder="Search by name or note" aria-label="Search perfumes">
      <select id="noteSel" aria-label="Filter by note"><option value="">All notes</option></select>
      <select id="sortSel" aria-label="Sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name A–Z</option></select>
    </div>
  </div>
  <p class="result-n" id="resultN"></p>
  <div class="grid" id="grid"></div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/site.js"></script>
<script>

const qs=new URLSearchParams(location.search);
const state={chip:qs.get('c')||'all',note:qs.get('note')||'',q:(qs.get('q')||'').toLowerCase(),sort:'featured'};
const CH=[['all','All'],['best','Best sellers'],['new','New'],['sweet','Sweet & gourmand'],['floral','Floral oud'],['woody','Woody & smoky'],['fresh','Fresh & fruity']];
$('#chips').innerHTML=CH.map(([k,l])=>`<button class="chip" data-chip="${k}">${l}</button>`).join('');
[...new Set(PERFUMES.flatMap(p=>p.notes))].sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('#noteSel').appendChild(o)});
$('#noteSel').value=state.note;$('#pq').value=qs.get('q')||'';
function render(){
 $$('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.chip===state.chip));
 let L=PERFUMES.filter(p=>{
  if(state.chip==='fresh'&&!(p.tags.includes('fresh')||p.tags.includes('fruity')))return false;
  else if(state.chip!=='all'&&state.chip!=='fresh'&&!p.tags.includes(state.chip))return false;
  if(state.note&&!p.notes.includes(state.note))return false;
  if(state.q&&!(p.name+' '+p.family+' '+p.notes.join(' ')+' '+p.story).toLowerCase().includes(state.q))return false;
  return true});
 if(state.sort==='low')L.sort((a,b)=>a.price-b.price);if(state.sort==='high')L.sort((a,b)=>b.price-a.price);if(state.sort==='az')L.sort((a,b)=>a.name.localeCompare(b.name));
 $('#grid').innerHTML=L.length?L.map(perfumeCard).join(''):`<div class="empty">No perfumes match that. <button class="linkbtn" id="clr">Clear filters</button>${state.q?` or <a class="tlink" href="search.html?q=${encodeURIComponent(state.q)}">search refills and diffusers too</a>`:''}</div>`;
 $('#resultN').textContent=`${L.length} perfume${L.length===1?'':'s'}`;
 const u=new URL(location);['c','note','q'].forEach(k=>u.searchParams.delete(k));if(state.chip!=='all')u.searchParams.set('c',state.chip);if(state.note)u.searchParams.set('note',state.note);if(state.q)u.searchParams.set('q',state.q);history.replaceState(null,'',u);
}
document.addEventListener('click',e=>{const c=e.target.closest('#chips [data-chip]');if(c){state.chip=c.dataset.chip;render()}if(e.target.id==='clr'){state.chip='all';state.note='';state.q='';$('#noteSel').value='';$('#pq').value='';render()}});
$('#noteSel').addEventListener('change',e=>{state.note=e.target.value;render()});
$('#sortSel').addEventListener('change',e=>{state.sort=e.target.value;render()});
$('#pq').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();render()});
if($('#q'))$('#q').value=qs.get('q')||'';
render();

</script>
</body>
</html>
