<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search | Sapphire Scents</title>
<meta name="description" content="Search Sapphire Scents perfumes, scent refills and diffusers.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070C29">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070C29'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='36' fill='%23FF9E0D'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css?v=202611240420">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
<header id="site-header" class="site"></header>
<main id="top">
<section class="pagehead"><div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Search</span></nav><h1>Search <em>the house</em></h1>
  <form class="sform" action="search.html" role="search"><input class="field-inline" id="sq" name="q" type="search" placeholder="Try oud, Jagaban, mango, diffuser" aria-label="Search perfumes, refills and diffusers" autocomplete="off"><button class="btn solid" type="submit">Search</button></form>
</div></section>
<section class="band" style="padding-top:20px"><div class="wrap" id="sres"></div></section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/catalog.js?v=202611240420"></script>
<script src="/api/catalog"></script>
<script src="assets/js/site.js?v=202611240420"></script>
<script>
const raw=(new URLSearchParams(location.search).get('q')||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
$('#sq').value=raw;if($('#q'))$('#q').value=raw;if($('#mq'))$('#mq').value=raw;
const words=raw.toLowerCase().split(/\s+/).filter(Boolean);
const hay=p=>[p.name,p.kind,p.type,p.type==='refill'?'refill refills diffuser oil scent refill':'',p.type==='diffuser'?'diffuser diffusers machine':'',p.type==='perfume'?'perfume perfumes':'',p.family,p.tagline,p.note,p.summary,p.story,(p.notes||[]).join(' '),(p.tags||[]).join(' ')].filter(Boolean).join(' ').toLowerCase();
const match=p=>words.every(w=>hay(p).includes(w)||hay(p).includes(w.replace(/s$/,'')));
function block(title,list,more){return list.length?`<div class="sgroup"><div class="sghead"><h2>${title} <span>${list.length}</span></h2>${more?`<a class="tlink" href="${more}">See all</a>`:''}</div><div class="grid${title==='Diffusers'?' g3':''}">${list.map(anyCard).join('')}</div></div>`:''}
if(!words.length){$('#sres').innerHTML='<p class="result-n">Type a scent, a note or a product to search perfumes, refills and diffusers.</p>'}
else{
 const P=PERFUMES.filter(match),R=REFILLS.filter(match),D=DIFFUSERS.filter(match),n=P.length+R.length+D.length;
 document.title=`“${raw}” | Search | Sapphire Scents`;
 $('#sres').innerHTML=`<p class="result-n">${n} result${n===1?'':'s'} for “${esc(raw)}”</p>`+(n?block('Perfumes',P,'perfumes.html')+block('Scent refills',R,'refills.html')+block('Diffusers',D,'diffusers.html')
  :`<div class="empty">Nothing matches “${esc(raw)}”. Try a note like oud or vanilla, or <a class="tlink" href="perfumes.html">browse all perfumes</a>.</div>`);
}
</script>
</body>
</html>
